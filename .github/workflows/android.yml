name: Build (Android)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Download the same-head real KMP root publication
        uses: actions/download-artifact@v8
        with:
          name: kmp-root-publication-${{ github.sha }}
          path: build/root-publication

      - name: Start a real Android x86-64 emulator
        run: bash verification/start-android-ci-emulator.sh

      - name: Build and test Android targets
        run: >
          ./gradlew
          setupAndroidSdk
          compileAndroidMain
          assembleUnitTest
          assembleAndroidTest
          testAndroidHostTest
          connectedAndroidDeviceTest
          linkDebugTestAndroidNativeX64
          verifyAndroidPublication
          -Pproject.publication.android.rootStagingDirectory=build/root-publication/staging-deploy
          -Pproject.publication.android.expectedRootHead=${{ github.sha }}
          --no-configuration-cache

      - name: Verify Android device test execution
        run: >
          python3 verification/verify_behavior_results.py
          build/outputs/androidTest-results/connected
          --require testHttp11Pipelining
          --require testHttp2Multiplex
          --require shouldSanitizeHttp1ExceptConnect
          --require basicCredentialsAreAddedOnlyForAnInsecureProxy
          --require authRequiredFormatsLikeUpstreamDisplay

      - name: Execute the actual Android Native x86-64 binary
        run: |
          set -o pipefail
          adb -s emulator-5554 push build/bin/androidNativeX64/debugTest/test.kexe /data/local/tmp/rama-http-backend-native-test
          adb -s emulator-5554 shell chmod 755 /data/local/tmp/rama-http-backend-native-test
          adb -s emulator-5554 shell 'cd /data/local/tmp && ./rama-http-backend-native-test' | tee build/android-native-tests.log
          grep -q "\[  PASSED  \] 18 tests\." build/android-native-tests.log

      - name: Upload actual Android test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-behavior-tests
          path: |
            build/test-results/
            build/reports/publication/
            build/outputs/androidTest-results/
            build/android-native-tests.log
            build/android-ci-emulator.log
          if-no-files-found: error

      - name: Stop the CI emulator
        if: always()
        run: adb -s emulator-5554 emu kill
