[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
http = "0.1.3"
ramaCore = "0.1.1"
ramaHttp = "0.1.0"
ramaNet = "0.1.2"
ramaTcp = "0.1.0"
ramaUnix = "0.1.1"
tokio = "0.1.1"
androidKmp = "9.4.1"
vanniktech = "0.37.0"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
http = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
rama-core = { module = "io.github.kotlinmania:rama-core-kotlin", version.ref = "ramaCore" }
rama-http = { module = "io.github.kotlinmania:rama-http-kotlin", version.ref = "ramaHttp" }
rama-net = { module = "io.github.kotlinmania:rama-net-kotlin", version.ref = "ramaNet" }
rama-tcp = { module = "io.github.kotlinmania:rama-tcp-kotlin", version.ref = "ramaTcp" }
rama-unix = { module = "io.github.kotlinmania:rama-unix-kotlin", version.ref = "ramaUnix" }
tokio = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }

[bundles]
rama-http-backend-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "http",
  "rama-core",
  "rama-http",
  "rama-net",
  "rama-tcp",
  "rama-unix",
  "tokio",
]
